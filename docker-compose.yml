services:
  postgres:
    image: postgres:16-alpine
    container_name: leadfinder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_lead_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_lead_finder"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leadfinder_network

  redis:
    image: redis:7-alpine
    container_name: leadfinder_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leadfinder_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: leadfinder_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ai_lead_finder?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-secret-key-change-me-in-production-environments
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadfinder_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: leadfinder_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - leadfinder_network

volumes:
  postgres_data:
  redis_data:

networks:
  leadfinder_network:
    driver: bridge
